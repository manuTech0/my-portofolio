services:
  web:
    build:
      context: .
      target: web
    ports:
      - "9100:80"
    depends_on:
      - api

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      APP_ENV: production
      TRUST_PROXY: "true"
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
